# Keeps scripts/fallback-services.json (and the generated <service>/ pages) derived from cloud-u-containers.
# Triggers: repository_dispatch fallback-services-bump (sent by cloud-u-containers when the file changes),
# a 3-hourly schedule as the safety net, manual. Commits only on change, then bumps the Pages mirror.
name: sync-fallback-services
on:
  schedule:
    - cron: '17 */3 * * *'
  repository_dispatch:
    types: [fallback-services-bump]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sync-fallback-services
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-fallback-services.mjs && node scripts/gen-nav.mjs
      - name: Commit, test, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          bash scripts/test.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: sync service fallback pages from cloud-u-containers [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run bump-pages.yml
